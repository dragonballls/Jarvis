name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  windows:
    name: Build Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pywebview pyinstaller

      - name: Install frontend dependencies
        working-directory: desktop
        shell: pwsh
        run: npm ci

      - name: Build frontend
        working-directory: desktop
        shell: pwsh
        run: npm run build

      - name: Build Windows bundle
        shell: pwsh
        run: python packaging/windows/build.py

      - name: Smoke-test Windows bundle
        shell: pwsh
        run: python packaging/windows/smoke_test.py

      - name: Verify packaged app
        shell: pwsh
        run: |
          if (-not (Test-Path build/windows/Jarvis.exe)) { throw "build/windows/Jarvis.exe was not produced" }
          if (-not (Test-Path build/windows/VERSION)) { throw "build/windows/VERSION was not produced" }
          $expected = "${{ github.sha }}"
          $actual = (Get-Content build/windows/VERSION -Raw).Trim()
          if ($actual -ne $expected) { throw "VERSION mismatch: expected $expected but found $actual" }

      - name: Upload Windows app
        uses: actions/upload-artifact@v6
        with:
          name: Jarvis-Windows
          path: build/windows/Jarvis.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate release notes from conventional commits
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Download Windows app
        uses: actions/download-artifact@v7
        with:
          name: Jarvis-Windows
          path: release-assets/Jarvis-Windows

      - name: Draft GitHub release with Windows app
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: true
          files: |
            release-assets/Jarvis-Windows/**
