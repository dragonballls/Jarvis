name: Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "core/**"
      - "agent/**"
      - "providers/**"
      - "config/**"
      - "integrations/**"
      - "plugins/**"
      - "scripts/**"
      - "requirements.txt"
      - "packaging/windows/**"
      - ".github/workflows/windows-app.yml"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pywebview pyinstaller

      - name: Install frontend dependencies
        working-directory: desktop
        shell: pwsh
        run: npm ci

      - name: Build frontend
        working-directory: desktop
        shell: pwsh
        run: npm run build

      - name: Verify frontend bundle exists
        shell: pwsh
        run: |
          if (-not (Test-Path desktop/dist/index.html)) { throw "desktop/dist/index.html was not produced" }

      - name: Build Windows single-file app
        shell: pwsh
        run: python packaging/windows/build.py

      - name: Verify packaged app metadata
        shell: pwsh
        run: |
          if (-not (Test-Path build/windows/Jarvis.exe)) { throw "build/windows/Jarvis.exe was not produced" }
          if (-not (Test-Path build/windows/VERSION)) { throw "build/windows/VERSION was not produced" }
          $expected = "${{ github.sha }}"
          $actual = (Get-Content build/windows/VERSION -Raw).Trim()
          if ($actual -ne $expected) { throw "VERSION mismatch: expected $expected but found $actual" }

      - name: Smoke-test packaged executable
        shell: pwsh
        run: python packaging/windows/smoke_test.py

      - name: Verify smoke-test log
        shell: pwsh
        run: |
          if (-not (Test-Path build/windows/smoke_test.log)) { throw "Smoke-test log was not produced" }
          $log = Get-Content build/windows/smoke_test.log -Raw
          if ($log -notmatch "Jarvis smoke test passed") { throw "Packaged smoke test did not report success" }

      - name: Upload single-file Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows
          path: build/windows/Jarvis.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling Windows update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $commitPath = Join-Path $env:RUNNER_TEMP "jarvis-commit.txt"
          Set-Content -Path $commitPath -Value "${{ github.sha }}" -NoNewline
          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest build/windows/Jarvis.exe $commitPath --title "Jarvis latest Windows build" --notes "Automated Windows build for ${{ github.sha }}"
          } else {
            gh release upload latest build/windows/Jarvis.exe#Jarvis.exe $commitPath#jarvis-commit.txt --clobber
            gh release edit latest --title "Jarvis latest Windows build" --notes "Automated Windows build for ${{ github.sha }}"
          }
