name: Jarvis integration verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: jarvis-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Jarvis
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run integration and component-boundary tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q core integrations plugins agent providers mark53 mark_updater self_coding
          python -m pytest -q \
            core/test_gods_eye_bridge.py \
            core/test_gods_eye_context.py \
            core/gods_eye_intent_examples_test.py \
            integrations/gods_eye/test_adapter.py \
            integrations/gods_eye/test_contract.py \
            tests/test_gods_eye_intent.py \
            tests/test_gods_eye_intent_safety.py \
            tests/test_gods_eye_plugin_discovery.py \
            tests/test_provider_routing.py \
            tests/test_provider_fallback.py \
            tests/test_component_boundaries.py
